name: Validate IsaiahAI Gateway
on:
  push:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'package.json'
      - '.github/workflows/validate-gateway.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/index.js'
      - 'package.json'
      - '.github/workflows/validate-gateway.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check gateway JavaScript syntax
        run: npm run check
